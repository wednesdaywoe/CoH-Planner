# Deploy to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [rebuild, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # `vite build` needs far more than Node's default ~2GB heap, and going
          # over doesn't fail the deploy loudly: the build OOMs and the Pages
          # step silently skips.
          #
          # 10240 was sized for three datasets. Brainstorm made it four and the
          # build measured 9.72GB peak RSS against that 10GB ceiling, so it was
          # passing on roughly 3% headroom. 14336 restores room for a fifth
          # dataset and still leaves ~1.5GB for the OS on a 16GB runner.
          # Re-measure before adding another dataset rather than raising blind.
          NODE_OPTIONS: --max-old-space-size=14336
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
