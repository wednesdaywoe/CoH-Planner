        - generic [ref=e452]:
          - paragraph [ref=e453]: Thank you for helping test Sidekick Beta! Your feedback is invaluable in improving this planner. I push updates frequently, so if you encounter bugs, issues, or have suggestions for features, please reach out through the contact methods above.
          - paragraph [ref=e454]: Thank you for your patience and support! Especially your patience. CoH is complicated 😅 -WW
        - paragraph [ref=e455]: "Sidekick is in active beta development, so please be patient with bugs and errors. Here's what's been updated on May 20, 2026:"
        - list [ref=e456]:
          - listitem [ref=e457]:
            - generic [ref=e458]: New
            - generic [ref=e459]: The Maximize Enhancements feature has been changed and extended to a new modal that allows bulk-editing of enhancement levels, attunement, and boosters across the entire build
          - listitem [ref=e460]:
            - generic [ref=e461]: Fixed
            - generic [ref=e462]: Rebirth powersets + Rebirth pool/epic pools + Rebirth pet-entities + Rebirth incarnates all regenerated with corrected wiring for summons and redirects, some missing icons located
          - listitem [ref=e463]:
            - generic [ref=e464]: New
            - generic [ref=e465]: Added a helper to computeAllSlotLevels once and write one slotOrder to capture the respec-mode level as the stored level
          - listitem [ref=e466]:
            - generic [ref=e467]: New
            - generic [ref=e468]: "Improved build management options: menu items are now New Build, Clear Powers, Clear Slots, Clear Enhancements, and Maximize Enhancements"
          - listitem [ref=e469]:
            - generic [ref=e470]: Fixed
            - generic [ref=e471]: Added some UI helpers for Firefox users
          - listitem [ref=e472]:
            - generic [ref=e473]: New
            - generic [ref=e474]: Extended enemy level to +7 for HC datasets. Defense softcaps should change depending on target level and a new content mode toggle
          - listitem [ref=e475]:
            - generic [ref=e476]: ⚙️
            - generic [ref=e477]: Just an absolute dumptruck of changes, QOL features, and bug fixes...
          - listitem [ref=e478]:
            - generic [ref=e479]: Fixed
            - generic [ref=e480]: Ragnarok piece 6 on Rebirth correctly labeled "Chance for Knockdown" (was "Chance for Knockback"); Rebirth extractor now carries a rename map
          - listitem [ref=e481]:
            - generic [ref=e482]: Fixed
            - generic [ref=e483]: Brine no longer gives the caster +MaxHP. Foe -MaxHP debuffs are no longer laundered into a self buff by the powerset converter. Marine Affinity regenerated across all 4 ATs.
          - listitem [ref=e484]:
            - generic [ref=e485]: New
            - generic [ref=e486]: Enhancement picker remembers the last filter you used per power (slot an ATO into Footstomp once, the picker opens to ATOs next time)
          - listitem [ref=e487]:
            - generic [ref=e488]: New
            - generic [ref=e489]: Multi-slot common IOs / HOs / SOs in one go! 😎 In Select Multiple mode, taps stack a count badge, bar fills empty slots in order
          - listitem [ref=e490]:
            - generic [ref=e491]: Fixed
            - generic [ref=e492]: Set bonus values display fixes (Luck of the Gambler 3pc now reads +1.125% instead of +1.13% / +1.1%). Dashboard stat breakdowns also use the precise value across all sets, not just LotG.
          - listitem [ref=e493]:
            - generic [ref=e494]: Fixed
            - generic [ref=e495]: Accolade rows in the dashboard breakdown now show the % suffix on MaxHP contributions (e.g. "+10%" instead of "+10")
          - listitem [ref=e496]:
            - generic [ref=e497]: New
            - generic [ref=e498]: Auto-reload on stale-tab failures. After a deploy, browsers still holding the old shell will reload themselves instead of showing a blank page on the next chunk import
          - listitem [ref=e499]:
            - generic [ref=e500]: New
            - generic [ref=e501]: Mids .mbd import should now correctly set power activations. The importer now reads StatInclude (→ active) and VariableValue (→ stack/targets slider) for every power. Fresh imports reproduce Mids' default totals without manual toggling
          - listitem [ref=e502]:
            - generic [ref=e503]: Fixed
            - generic [ref=e504]: Targets-hit / stack slider is now capped at each power's declared maxStacks
          - listitem [ref=e505]:
            - generic [ref=e506]: ⚙️
            - generic [ref=e507]: Recharge totals now use Mids' Haste convention. The dashboard shows 100% base + bonuses so the number lines up with what Mids displays (Rech 271% instead of +171%)
          - listitem [ref=e508]:
            - generic [ref=e509]: ⚙️
            - generic [ref=e510]: Exemplar Mode no longer persists across page reloads, and a subtle banner reminds you when it's on (silently scaling every recharge / damage / defense number was hard to debug when the toggle was forgotten)
          - listitem [ref=e511]:
            - generic [ref=e512]: Fixed
            - generic [ref=e513]: Proc damage chance now factors in slotted Recharge enhancement. Slotting a Recharge IO will lower a proc's chance per cast
          - listitem [ref=e514]:
            - generic [ref=e515]: Fixed
            - generic [ref=e516]: Superior ATO 5ppm damage procs now parse and contribute
          - listitem [ref=e517]:
            - generic [ref=e518]: Fixed
            - generic [ref=e519]: "Lightning Rod and Shield Charge no longer say \"Target type: Dead Teammate\". That was the teleport mechanic's positional target leaking through to the UI."
          - listitem [ref=e520]:
            - generic [ref=e521]: ⚙️
            - generic [ref=e522]: Lightning Rod and Shield Charge now display per-cast damage in the main Damage block (with the cap-relative meter, three-tier numbers, DPA/DPS/DPE modes) instead of hiding the actual damage behind a collapsed Pet DPS row. Lightning Rod's damage now appears at all. Previously the summon entity pointed at a positional anchor with no damage data, so the panel was empty
          - listitem [ref=e523]:
            - generic [ref=e524]: New
            - generic [ref=e525]: Incarnate proc damage (Hybrid Assault doublehit, Interface DoT procs) is now included in the per-attack damage breakdown. Hybrid Assault Radial Embodiment's Energy doublehit and all six Interface Flawless DoTs (Reactive / Cognitive / Spectral / Degenerative / Preemptive × Core/Radial) appear as rows in "Damage from Procs". AoE attacks apply the proc to all targets hit to match what Mids'
          - listitem [ref=e526]:
            - generic [ref=e527]: Fixed
            - generic [ref=e528]: Fixed proc averager calc for power pools and chance for Build Ups
